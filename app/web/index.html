<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Agentic Commerce — Buyer Journey</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <div class="brand-title">Trust Agentic Commerce</div>
        <div class="brand-sub">Buyer journey · context-isolated security scouts</div>
      </div>
    </div>
    <div class="controls">
      <label class="stores-ctrl">contamination
        <select id="levelSel">
          <option value="0">0% · clean baseline</option>
          <option value="0.2">20% · light fake flood</option>
          <option value="0.4" selected>40% · flood + injection</option>
          <option value="0.6">60% · heavy attack</option>
        </select>
      </label>
      <button id="rerunBtn" class="btn">↻ Re-run audit</button>
      <span id="modeBadge" class="badge">…</span>
      <a id="weaveBadge" class="badge weave hidden" target="_blank" rel="noopener">◢ Weave</a>
    </div>
  </header>

  <main class="layout">
    <!-- LEFT: buyer + personal context -->
    <aside class="rail left" id="buyerPanel"></aside>

    <!-- CENTER: the journey flow -->
    <section class="flow" id="flow">
      <div class="flow-head">
        <span class="flow-step">1 · Buyer question</span>
        <span class="flow-arrow">→</span>
        <span class="flow-step">2 · Concierge dispatches isolated scouts</span>
        <span class="flow-arrow">→</span>
        <span class="flow-step">3 · Each scout runs 4 security sub-agents</span>
        <span class="flow-arrow">→</span>
        <span class="flow-step">4 · Concierge adjudicates (trust-gated)</span>
      </div>
      <div id="plannerNode" class="planner-node"></div>
      <svg id="edges" class="edges"></svg>
      <div id="sellerGrid" class="seller-grid"></div>
      <div id="conciergeNode" class="planner-node concierge"></div>
    </section>

    <!-- RIGHT: ground truth + scoreboard -->
    <aside class="rail right" id="truthPanel"></aside>
  </main>

  <!-- seller detail drawer -->
  <div id="drawer" class="drawer hidden">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-panel" id="drawerPanel"></div>
  </div>

  <div id="loading" class="loading hidden"><div class="spinner"></div><span>running agents…</span></div>

  <script src="app.js"></script>
</body>
</html>
